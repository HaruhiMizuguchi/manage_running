{% extends "base.html" %}
{% block content %}
  <section class="hero">
    <h1>体重ログ</h1>
    <p class="muted">減量目的の進捗をシンプルに管理します（同じ日付は上書き）。</p>
  </section>

  <form class="card form" method="post" action="/weight">
    <div class="row">
      <div class="col">
        <label class="label">日付</label>
        <input class="input" type="date" name="date" required />
      </div>
      <div class="col">
        <label class="label">体重(kg)</label>
        <input class="input" type="number" step="0.1" name="weight_kg" required />
      </div>
    </div>
    <label class="label">メモ（任意）</label>
    <input class="input" type="text" name="note" placeholder="睡眠不足、飲み会、など" />
    <button class="btn" type="submit">保存</button>
  </form>

  <section class="section">
    <h2>履歴（最新365日）</h2>
    {% if rows|length == 0 %}
      <p class="muted">まだ記録がありません。</p>
    {% else %}
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>日付</th>
              <th class="right">体重</th>
              <th>メモ</th>
            </tr>
          </thead>
          <tbody>
            {% for r in rows %}
              <tr>
                <td>{{ r["date"] }}</td>
                <td class="right">{{ r["weight_kg"] }} kg</td>
                <td>{{ r["note"] or "" }}</td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    {% endif %}
  </section>
{% endblock %}
